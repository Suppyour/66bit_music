services:
  db:
    image: postgres:16-alpine
    container_name: music_loto_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: ghcr.io/suppyour/music_loto_api:latest
    build:
      context: ./MusicalLotoBackend
      dockerfile: Dockerfile
    container_name: music_loto_api
    depends_on:
      - db
    ports:
      - "127.0.0.1:30480:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - Minio__Endpoint=minio:9000
      - Minio__PublicEndpoint=${MINIO_PUBLIC_ENDPOINT}
    volumes:
      - app_wwwroot:/app/wwwroot
    restart: unless-stopped

  frontend:
    image: ghcr.io/suppyour/music_loto_frontend:latest
    build:
      context: ./MusicalLotoFrontend
      dockerfile: Dockerfile
    container_name: music_loto_frontend
    depends_on:
      - api
    ports:
      - "30481:80"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: music_loto_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    container_name: music_loto_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/music-loto --ignore-existing;
      /usr/bin/mc anonymous set download myminio/music-loto;
      exit 0;
      "

volumes:
  postgres_data:
  app_wwwroot:
  minio_data:
